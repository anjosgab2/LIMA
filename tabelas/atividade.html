<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <!-- 
    Atividade 1 - Criando uma tavela simples

    Crie uma página HTMl que contenha uma tabela com:

    - 3 colunas: Nome, Idade, Cidade
    - 4 pessoas cadastradas
    - Uma primeira linha contendo os títulos das colunas.
    -->
    
    <table border="1">

        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
            </tr>

        </thead>
        
        
        <tbody>
            <tr>
            <td>Gabriel</td>
            <td>16</td>
            <td>São Paulo</td>    
        </tr>

        <tr>
            <td>Leticia</td>
            <td>17</td>
            <td>São Paulo</td>
        </tr>

        <tr>
            <td>Vitoria</td>
            <td>17</td>
            <td>Embu Guaçu</td>
        </tr>

        <tr>
            <td>Eduarda</td>
            <td>17</td>
            <td>Embu Guaçu</td>
        </tr>
        </tbody>

    </table>

</body>
</html>
