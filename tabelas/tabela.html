<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <!-- -------------- TABELAS EM HTML -------------- -->
    <table border="1">  <!-- Estrutura para criar tabela -->

    </thead>

        <tr>
            <td>1</td> <!-- Dadp da Tabela-->

            <td>292</td>
            <td>8</td>

        </tr>

        <tr>
            <td>2</td>

        </tr>



    </tbody> 

    </table>



</body>
</html>
